name: Production Elasticsearch loopback rollout

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batch-elasticsearch-production
  cancel-in-progress: false

jobs:
  rollout:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      REMOTE_DIR: ${{ vars.PROD2_REMOTE_DIR }}
      PROD2_HOST: ${{ secrets.PROD2_HOST }}
      PROD2_USER: ${{ secrets.PROD2_USER }}
      PROD2_SSH_PORT: ${{ secrets.PROD2_SSH_PORT }}
      PROD2_SSH_PRIVATE_KEY: ${{ secrets.PROD2_SSH_PRIVATE_KEY }}
      PROD2_HOST_FINGERPRINT: ${{ secrets.PROD2_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate production host and recreate Elasticsearch
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          [[ "$GITHUB_REPOSITORY" == devnogi/open-api-batch-server ]]
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$REMOTE_DIR" =~ ^/([a-zA-Z0-9_-]+/)*[a-zA-Z0-9_-]+$ ]]
          [[ "$PROD2_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$PROD2_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$PROD2_SSH_PORT" == 46232 ]]
          [[ -n "$PROD2_SSH_PRIVATE_KEY" ]]
          [[ "$PROD2_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]$ ]]

          work=$(mktemp -d "$RUNNER_TEMP/elasticsearch-rollout.XXXXXXXX")
          trap 'rm -rf "$work"' EXIT
          if ! ssh-keyscan -T 15 -p "$PROD2_SSH_PORT" -t ed25519 "$PROD2_HOST" >"$work/known_hosts" 2>"$work/scan.log" ||
             ! awk 'NF != 3 || $2 != "ssh-ed25519" { bad=1 } END { exit (bad || NR != 1) }' "$work/known_hosts"; then
            echo 'Host key scan failed'
            exit 1
          fi
          fingerprint=$(ssh-keygen -E sha256 -lf "$work/known_hosts" 2>"$work/scan.log") || {
            echo 'Host key validation failed'
            exit 1
          }
          [[ "$fingerprint" == "256 $PROD2_HOST_FINGERPRINT "*' (ED25519)' ]] || {
            echo 'Host key validation failed'
            exit 1
          }

          printf '%s\n' "$PROD2_SSH_PRIVATE_KEY" >"$work/key"
          chmod 600 "$work/key" "$work/known_hosts"
          compose_sha256=$(sha256sum docker-compose-prod.yml | awk '{print $1}')
          [[ "$compose_sha256" =~ ^[a-f0-9]{64}$ ]]
          opts=(-i "$work/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 -o IdentitiesOnly=yes -o ConnectTimeout=15)

          set +e
          ssh -p "$PROD2_SSH_PORT" "${opts[@]}" "$PROD2_USER@$PROD2_HOST" bash -s -- \
            "$REMOTE_DIR" "$compose_sha256" < scripts/rebind-prod-elasticsearch.sh >"$work/ssh.log" 2>&1
          remote_status=$?
          set -e

          if [[ $remote_status -eq 0 ]] && grep -qx 'ROLLOUT_RESULT=SUCCESS' "$work/ssh.log"; then
            echo 'Elasticsearch loopback rollout verified'
            exit 0
          fi
          if grep -qx 'ROLLOUT_RESULT=ROLLBACK_FAILED' "$work/ssh.log"; then
            echo 'Elasticsearch rollout and rollback verification failed'
            exit 2
          fi
          if grep -qx 'ROLLOUT_RESULT=ROLLED_BACK' "$work/ssh.log"; then
            echo 'Elasticsearch rollout failed; the pre-change service state was restored'
            exit 1
          fi
          echo 'Elasticsearch rollout failed before a verified recovery result was received'
          exit 1
