name: Deploy batch production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: batch-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: chmod +x gradlew && ./gradlew verify --no-daemon
      - run: node --test scripts/test-production-workflow.mjs
      - run: node scripts/secret-scan.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:prod-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.PROD_SSH_PRIVATE_KEY }}' | tr -d '\r' > ~/.ssh/my-key.pem
          chmod 400 ~/.ssh/my-key.pem
          ssh-keyscan -p '${{ secrets.PROD_SERVER_PORT }}' -H '${{ secrets.PROD_SERVER_HOST }}' >> ~/.ssh/known_hosts
      - name: Copy candidate compose
        run: |
          ssh -p '${{ secrets.PROD_SERVER_PORT }}' -i ~/.ssh/my-key.pem '${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}' 'mkdir -p /opt/devnogi-batch/candidate'
          scp -P '${{ secrets.PROD_SERVER_PORT }}' -i ~/.ssh/my-key.pem docker-compose-prod.yml '${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}:/opt/devnogi-batch/candidate/'
      - name: Deploy digest and check health
        run: |
          ssh -p '${{ secrets.PROD_SERVER_PORT }}' -i ~/.ssh/my-key.pem '${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}' <<'EOF'
            set -eu
            cd /opt/devnogi-batch
            umask 077
            printf '%s\n' '${{ secrets.ENV_FILE_PROD }}' > .env.prod
            printf '%s' '${{ secrets.DOCKER_PASSWORD }}' | docker login -u '${{ secrets.DOCKER_USERNAME }}' --password-stdin
            IMAGE_REF='${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}@${{ steps.image.outputs.digest }}'
            case "$IMAGE_REF" in *@sha256:*) ;; *) echo 'Invalid image digest' >&2; exit 1 ;; esac
            export IMAGE_REF
            docker pull "$IMAGE_REF"
            old_id=$(docker inspect --format '{{.Image}}' devnogi-batch-app-prod 2>/dev/null || true)
            old_ref=''
            if [ -n "$old_id" ]; then old_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$old_id" 2>/dev/null || true); fi
            case "$old_ref" in *@sha256:*) ;; *) old_ref='' ;; esac
            previous_compose=false
            if [ -f docker-compose-prod.yml ]; then cp docker-compose-prod.yml .previous-compose.yml; previous_compose=true; fi
            cp candidate/docker-compose-prod.yml docker-compose-prod.yml
            rollback() {
              if [ -z "$old_ref" ]; then echo 'No previous immutable image; automatic rollback unavailable' >&2; return 1; fi
              if [ "$previous_compose" != true ]; then echo 'Previous compose unavailable' >&2; return 1; fi
              printf 'services:\n  spring-app:\n    image: %s\n' "$old_ref" > .rollback-image.yml
              if ! IMAGE_REF="$old_ref" DOCKER_USERNAME='${{ secrets.DOCKER_USERNAME }}' DOCKER_REPO='${{ secrets.DOCKER_REPO }}' DOCKER_IMAGE_TAG=prod docker compose -f .previous-compose.yml -f .rollback-image.yml --env-file .env.prod up -d --no-deps spring-app; then
                echo 'Rollback failed' >&2
                return 1
              fi
              cp .previous-compose.yml docker-compose-prod.yml
            }
            if ! docker compose -f docker-compose-prod.yml --env-file .env.prod up -d --no-deps spring-app; then rollback || true; exit 1; fi
            healthy=false
            for attempt in $(seq 1 72); do
              if curl -fsS 'http://127.0.0.1:${{ secrets.PROD_APP_PORT || 8080 }}/actuator/health' | grep -q '"status":"UP"'; then healthy=true; break; fi
              sleep 5
            done
            if [ "$healthy" != true ]; then rollback || true; exit 1; fi
            if [ -n "$old_ref" ]; then printf '%s\n' "$old_ref" > .previous-image-ref; fi
            printf '%s\n' "$IMAGE_REF" > .last-deployed-image-ref
          EOF
