server:
  port: ${SERVER_PORT}
  address: 0.0.0.0
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: [ "health" ]

spring:
  application:
    name: open-api-batch-server
  web:
    resources:
      static-locations: classpath:/static/
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_IP}:${DB_PORT}/${DB_SCHEMA}?rewriteBatchedStatements=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 100
  flyway:
    enabled: true
    encoding: UTF-8
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  mvc:
    contentnegotiation:
      # URL 확장자에 의한 컨텐트 타입 결정
      favor-path-extension: true
      # Accept 헤더 무시
      ignore-accept-header: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY} # seconds (1 hour)
  refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY} # seconds (1 day)

springdoc:
  swagger-ui:
    persist-authorization: true
    operations-sorter: alpha
    tags-sorter: alpha
    disable-swagger-default-url: true
    display-request-duration: true
    classification:
      readyToUseGroupName: 개발 완료 API
      workInProgressGroupName: 개발 진행중 API
      deprecatedGroupName: 더이상 유지보수되지 않는 API

decorator:
  datasource:
    p6spy:
      enable-logging: false

logging:
  config: classpath:logback/logback-display.xml
  level:
    until.the.eternity: DEBUG

app:
  kafka:
    topics:
      user-verification-verify: ${KAFKA_TOPIC_USER_VERIFICATION_VERIFY:USER_VERIFICATION_VERIFY_EVENT}

openapi:
  nexon:
    base-url: https://open.api.nexon.com/mabinogi/v1
    api-key: ${NEXON_OPEN_API_KEY}
    max-in-memory-size-mb: 5
    default-timeout-seconds: 5
  auction-history:
    delay-ms: ${AUCTION_HISTORY_DELAY_MS}
    cron: ${AUCTION_HISTORY_CRON}
  min-price:
    cron: ${AUCTION_HISTORY_MIN_PRICE_CRON}
