name: Service verification
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: devnogi/ci-workflows/.github/workflows/spring-ci.yml@5c46d7aff8ce452b72ad8f6c18bcb5a09828384d
    with:
      service-profile: batch
      service-name: batch
      dockerfile: Dockerfile
      compose-file: docker-compose-prod.yml
