version: "3.8"

# =============================================================================
# 로컬 개발 환경용 Docker Compose 설정 (Profile: local)
# =============================================================================
# 사용법: docker-compose -f docker-compose-local.yml --env-file .env.local up -d --build
# 참고: 쉘 환경 변수가 .env.local 파일의 값을 오버라이드할 수 있으므로 --env-file 옵션을 명시하는 것이 좋습니다
# =============================================================================

services:
  spring-app:
    build:
      context: .
      dockerfile: Dockerfile
    # 로컬 이미지 이름 (Docker Hub에 push하지 않음)
    image: open-api-batch-server:local
    container_name: devnogi-batch-app-local
    ports:
      - "${SERVER_PORT:-8092}:${SERVER_PORT:-8092}"
    env_file:
      - .env.local  # 로컬 환경 변수 파일 (DB, JWT, API 키 등 민감 정보)
    labels:
      autoheal: "true"
    environment:
      # === Application Configuration ===
      SPRING_PROFILES_ACTIVE: local
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SERVER_PORT: ${SERVER_PORT:-8092}

      # === Database Configuration ===
      # Docker 네트워크 내부 연결 설정 (고정값)
      DB_IP: mysql  # Docker 서비스 이름
      DB_PORT: ${DB_PORT:-3318}  # Docker 네트워크 내부 포트
      DB_SCHEMA: ${DB_SCHEMA}
      DB_USER: ${DB_USER}  # 애플리케이션 전용 사용자 (local_oab)
      DB_PASSWORD: ${DB_PASSWORD}

      # === Security Configuration ===
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-key-change-in-production}
      JWT_ACCESS_TOKEN_VALIDITY: ${JWT_ACCESS_TOKEN_VALIDITY:-3600000}
      JWT_REFRESH_TOKEN_VALIDITY: ${JWT_REFRESH_TOKEN_VALIDITY:-86400000}

      # === External API Configuration ===
      NEXON_OPEN_API_KEY: ${NEXON_OPEN_API_KEY}
      AUCTION_HISTORY_DELAY_MS: ${AUCTION_HISTORY_DELAY_MS:-1000}
      AUCTION_HISTORY_CRON: "${AUCTION_HISTORY_CRON:-0 0 * * * *}"
      STATISTICS_PREVIOUS_DAY_CRON: "${STATISTICS_PREVIOUS_DAY_CRON:-0 0 * * * *}"

      # === JVM Configuration (Local - 경량 개발용) ===
      # Heap: 256m~512m, Non-Heap: 256m, Total: ~768m
      JAVA_OPTS: >-
        -Xms${JAVA_OPTS_XMS:-512m}
        -Xmx${JAVA_OPTS_XMX:-1024m}
        -XX:MaxMetaspaceSize=${JAVA_OPTS_MAX_METASPACE_SIZE:-300m}
        -XX:ReservedCodeCacheSize=${JAVA_OPTS_RESERVED_CODE_CACHE_SIZE:-96m}
        -XX:MaxDirectMemorySize=${JAVA_OPTS_MAX_DIRECT_MEMORY_SIZE:-128m}
        -Xss${JAVA_OPTS_XSS:-1024k}
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=${JAVA_OPTS_MAX_GC_PAUSE_MILLIS:-400}
        -XX:G1HeapRegionSize=${JAVA_OPTS_G1_HEAP_REGION_SIZE:-4m}
        -XX:InitiatingHeapOccupancyPercent=${JAVA_OPTS_INITIATING_HEAP_OCCUPANCY_PERCENT:-45}
        -XX:+TieredCompilation
        -XX:TieredStopAtLevel=${JAVA_OPTS_TIERED_STOP_AT_LEVEL:-2}
        -XX:CICompilerCount=${JAVA_OPTS_CI_COMPILER_COUNT:-2}
        -XX:+UseCompressedOops
        -XX:+UseCompressedClassPointers
        -Djava.security.egd=file:/dev/./urandom
        -Dspring.jmx.enabled=false
    volumes:
      - app-logs:/app/logs  # Named volume 사용 (권한 문제 해결)
      # 로컬 개발 시 설정 파일 마운트 (선택사항)
      # - ./config:/app/config:ro
    restart: on-failure:3

    # === Docker Resource Limits (Local - 경량) ===
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m

    networks:
      - app-network
      - my-network  # MySQL 컨테이너와 통신을 위해 추가

    # MySQL이 준비될 때까지 대기
    depends_on:
      mysql:
        condition: service_healthy

    # === Health Check (Local - 표준) ===
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${SERVER_PORT:-8092}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s  # MySQL 초기화 시간 고려

    # === Logging (Local - 최소) ===
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: open-api-batch-mysql
    restart: unless-stopped
    env_file:
      - .env.local  # 환경 변수 파일 로드
    ports:
      - "${MYSQL_EXTERNAL_PORT:-3318}:${DB_PORT:-3318}"  # 외부 접속용 포트 (호스트에서 접근 시)
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_SCHEMA}
      # 애플리케이션 전용 사용자 생성 (보안 best practice)
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      # 참고: MYSQL_USER는 자동으로 MYSQL_DATABASE에 대한 모든 권한을 받습니다
      # root 사용자는 MYSQL_ROOT_PASSWORD로 별도 생성됨
      LANG: C.UTF_8
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - my-network
    # MySQL Health Check
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - --port=${DB_PORT:-3318}
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --skip-character-set-client-handshake
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --default-time-zone=+09:00  # MySQL 레벨 타임존 설정
      - --explicit_defaults_for_timestamp=1  # TIMESTAMP 기본값 명시 허용

  # === Autoheal (Local - 표준) ===
  # unhealthy 컨테이너 자동 재시작 서비스
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: devnogi-batch-autoheal-local
    restart: unless-stopped
    environment:
      AUTOHEAL_INTERVAL: 30        # 체크 주기 (초)
      AUTOHEAL_START_PERIOD: 0     # 시작 유예 시간 (healthcheck start_period를 따름)
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 10  # graceful shutdown 대기 시간 (초)
      DOCKER_SOCK: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 50m
        reservations:
          memory: 20m

volumes:
  mysql_data:
  app-logs:
    driver: local

networks:
  app-network:
    driver: bridge
  my-network:
