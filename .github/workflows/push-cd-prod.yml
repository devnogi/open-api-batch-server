name: Production deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: batch-production
  cancel-in-progress: false
jobs:
  contract:
    name: workflow-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node --test scripts/workflow-contract.test.mjs
  production:
    needs: contract
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: devnogi/ci-workflows/.github/workflows/spring-prod.yml@5e016f1fec66dd7e0bb752ec77d822b80940ac0c
    with:
      service-profile: batch
      deployment-target: prod2
      service-name: batch
      dockerfile: Dockerfile
      compose-file: docker-compose-prod.yml
      health-timeout: '300'
      platform: linux/amd64
    secrets: inherit
