version: "3.8"

services:
  spring-app:
    image: ${DOCKER_USERNAME}/${DOCKER_REPO}:latest
    container_name: spring-app
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    env_file:
      - .env
    labels:
      # Autoheal: unhealthy 상태 시 자동 재시작 활성화
      autoheal: "true"
    environment:
      # === Application Configuration ===
      SPRING_CONFIG_LOCATION: file:/app/config/application.yaml
      SPRING_PROFILES_ACTIVE: dev
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SERVER_PORT: ${SERVER_PORT}

      # === Database Configuration ===
      DB_IP: ${DB_IP}
      DB_PORT: ${DB_PORT}
      DB_SCHEMA: ${DB_SCHEMA}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      # === Security Configuration ===
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_VALIDITY: ${JWT_ACCESS_TOKEN_VALIDITY}
      JWT_REFRESH_TOKEN_VALIDITY: ${JWT_REFRESH_TOKEN_VALIDITY}

      # === External API Configuration ===
      NEXON_OPEN_API_KEY: ${NEXON_OPEN_API_KEY}
      AUCTION_HISTORY_DELAY_MS: ${AUCTION_HISTORY_DELAY_MS}
      AUCTION_HISTORY_CRON: "${AUCTION_HISTORY_CRON}"
      AUCTION_HISTORY_MIN_PRICE_CRON: "${AUCTION_HISTORY_MIN_PRICE_CRON}"

      # === Docker Configuration ===
      DOCKER_USERNAME: ${DOCKER_USERNAME}
      DOCKER_REPO: ${DOCKER_REPO}

      # === JVM Configuration (Development Environment) ===
      # Dockerfile의 기본값(Xmx1024m)을 오버라이드하여 개발 환경에 맞게 조정
      JAVA_OPTS: >-
        -Xms256m
        -Xmx512m
        -XX:MaxMetaspaceSize=150m
        -XX:ReservedCodeCacheSize=48m
        -XX:MaxDirectMemorySize=64m
        -Xss512k
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:G1HeapRegionSize=2m
        -XX:InitiatingHeapOccupancyPercent=45
        -XX:+TieredCompilation
        -XX:TieredStopAtLevel=2
        -XX:CICompilerCount=2
        -XX:+UseCompressedOops
        -XX:+UseCompressedClassPointers
        -Djava.security.egd=file:/dev/./urandom
        -Dspring.jmx.enabled=false
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
    # Restart Policy:
    # - always: 항상 재시작 (수동 stop 포함)
    # - unless-stopped: 수동 stop 제외하고 재시작
    # - on-failure:5: 실패 시 최대 5번만 재시작 (무한 재시작 루프 방지)
    restart: on-failure:5

    # Docker Resource Limits (cgroup을 통한 강제 메모리 제한)
    deploy:
      resources:
        limits:
          memory: 750M                         # 컨테이너 최대 메모리: 750MB (700MB에서 증가, G1GC + 헬스체크 안정성)
        reservations:
          memory: 512M                         # 예약 메모리: 512MB (최소 보장 메모리, 450MB에서 증가)

    networks:
      - app-network
    # Health Check: 컨테이너 상태 감지 (autoheal과 연동)
    # curl 대신 wget 사용 (Alpine Linux에 기본 설치되어 있음)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${SERVER_PORT}/actuator/health"]
      interval: 30s              # 30초마다 체크
      timeout: 15s               # 15초 내 응답 없으면 실패 (GC 대응, 10s에서 증가)
      retries: 4                 # 4번 연속 실패 시 unhealthy (3에서 증가, 더 여유있게)
      start_period: 120s         # 시작 후 120초는 유예기간 (현재 77초 걸림, 여유있게 설정)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Autoheal: unhealthy 컨테이너 자동 재시작 서비스
  # - spring-app이 unhealthy 상태가 되면 자동으로 재시작
  # - Docker 소켓을 마운트하여 컨테이너 관리 권한 획득
  # - healthcheck와 독립적으로 동작 (healthcheck가 unhealthy 판정하면 autoheal이 재시작)
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      # AUTOHEAL_INTERVAL: 체크 주기 (초 단위)
      AUTOHEAL_INTERVAL: 30                    # 30초마다 unhealthy 컨테이너 체크 (healthcheck와 동기화)
      # AUTOHEAL_START_PERIOD: 컨테이너 시작 후 체크 시작까지 유예 시간 (초)
      AUTOHEAL_START_PERIOD: 0                 # healthcheck의 start_period를 따르므로 0으로 설정
      # AUTOHEAL_DEFAULT_STOP_TIMEOUT: 재시작 시 강제 종료까지 대기 시간 (초)
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 15        # 15초 내 종료 안 되면 강제 kill (Graceful shutdown 대기)
      # DOCKER_SOCK: Docker 소켓 경로 (컨테이너 제어용)
      DOCKER_SOCK: /var/run/docker.sock
    volumes:
      # Docker 소켓 마운트 (컨테이너 재시작 권한 획득)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network
    # autoheal은 매우 가벼운 서비스 (메모리 ~10MB)
    deploy:
      resources:
        limits:
          memory: 50M
        reservations:
          memory: 20M

networks:
  app-network:
    driver: bridge