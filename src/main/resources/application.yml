server:
  port: ${SERVER_PORT}
  address: 0.0.0.0
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: [ "health" ]
  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}

spring:
  application:
    name: open-api-batch-server
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2
          max-wait: 1000ms
  cache:
    type: redis
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
  web:
    resources:
      static-locations: classpath:/static/
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_IP}:${DB_PORT}/${DB_SCHEMA}?rewriteBatchedStatements=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 100
  flyway:
    enabled: true
    encoding: UTF-8
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  mvc:
    contentnegotiation:
      # URL 확장자에 의한 컨텐트 타입 결정
      favor-path-extension: true
      # Accept 헤더 무시
      ignore-accept-header: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY} # seconds (1 hour)
  refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY} # seconds (1 day)

springdoc:
  swagger-ui:
    persist-authorization: true
    operations-sorter: alpha
    tags-sorter: alpha
    disable-swagger-default-url: true
    display-request-duration: true
    classification:
      readyToUseGroupName: 개발 완료 API
      workInProgressGroupName: 개발 진행중 API
      deprecatedGroupName: 더이상 유지보수되지 않는 API

decorator:
  datasource:
    p6spy:
      enable-logging: true

logging:
  config: classpath:logback/logback-display.xml
  level:
    until.the.eternity: INFO
    org.springframework.data.redis: WARN
    org.springframework.boot.actuate.autoconfigure.data.redis: ERROR
    org.springframework.boot.actuate.data.redis: ERROR
    io.lettuce.core: WARN
    io.netty: WARN

openapi:
  nexon:
    base-url: https://open.api.nexon.com/mabinogi/v1
    api-key: ${NEXON_OPEN_API_KEY}
    max-in-memory-size-mb: 5
    default-timeout-seconds: 5
  auction-history:
    delay-ms: ${AUCTION_HISTORY_DELAY_MS}
    cron: ${AUCTION_HISTORY_CRON}
  min-price:
    cron: ${AUCTION_HISTORY_MIN_PRICE_CRON}
  horn-bugle:
    cron: ${HORN_BUGLE_CRON:0 */5 * * * *}
    max-retries: ${HORN_BUGLE_MAX_RETRIES:3}
    retry-delay-ms: ${HORN_BUGLE_RETRY_DELAY_MS:2000}
  auction-realtime:
    # 실시간 경매장 데이터 수집 스케줄러
    # 10분 간격: 0, 10, 20, 30, 40, 50분
    cron: ${AUCTION_REALTIME_CRON:0 0/10 * * * *}
    delay-ms: ${AUCTION_REALTIME_DELAY_MS:500}

statistics:
  previous-day:
    # 전날 통계 최종 확정 스케줄러
    # AuctionHistoryScheduler 실행 이후 전날 23시대 거래까지 포함한 통계를 확정
    # 기본값: 매일 00:10 (AuctionHistory가 00:05에 실행되므로 그 이후)
    cron: ${STATISTICS_PREVIOUS_DAY_CRON:0 10 0 * * *}

elasticsearch:
  # Elasticsearch 기능 활성화 여부 (false면 ES 관련 기능 비활성화, DB 검색만 사용)
  enabled: ${ELASTICSEARCH_ENABLED:true}
  index:
    # 서버 재기동 시 DB 데이터 일괄 색인 활성화 여부
    enabled: ${ELASTICSEARCH_INDEX_ENABLED:true}

app:
  cache:
    warmup:
      enabled: ${APP_CACHE_WARMUP_ENABLED:true}
      ranking-limit: ${APP_CACHE_WARMUP_RANKING_LIMIT:50}
  kafka:
    topics:
      user-verification-verify: ${KAFKA_TOPIC_USER_VERIFICATION_VERIFY:USER_VERIFICATION_VERIFY_EVENT}
