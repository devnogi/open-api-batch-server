version: "3.8"

services:
  spring-app:
    image: ${DOCKER_USERNAME}/${DOCKER_REPO}:latest
    container_name: spring-app
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    env_file:
      - .env
    environment:
      SPRING_CONFIG_LOCATION: file:/app/config/application.yaml
      SPRING_PROFILES_ACTIVE: dev
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SERVER_PORT: ${SERVER_PORT}
      DB_IP: ${DB_IP}
      DB_PORT: ${DB_PORT}
      DB_SCHEMA: ${DB_SCHEMA}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_VALIDITY: ${JWT_ACCESS_TOKEN_VALIDITY}
      JWT_REFRESH_TOKEN_VALIDITY: ${JWT_REFRESH_TOKEN_VALIDITY}
      NEXON_OPEN_API_KEY: ${NEXON_OPEN_API_KEY}
      AUCTION_HISTORY_DELAY_MS: ${AUCTION_HISTORY_DELAY_MS}
      AUCTION_HISTORY_CRON: "${AUCTION_HISTORY_CRON}"
      AUCTION_HISTORY_MIN_PRICE_CRON: "${AUCTION_HISTORY_MIN_PRICE_CRON}"
      DOCKER_USERNAME: ${DOCKER_USERNAME}
      DOCKER_REPO: ${DOCKER_REPO}
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
    restart: always
    # JVM Memory Optimization for 1GB RAM Server
    # 총 컨테이너 메모리: 600MB 이내로 제한
    command: [
      "java",
      # === Heap Memory Settings ===
      "-Xms128m",                              # Initial heap: 128MB (시작 시 힙 크기, 작게 시작하여 필요 시 확장)
      "-Xmx384m",                              # Maximum heap: 384MB (힙 최대 크기, 512MB에서 줄여 다른 메모리 영역에 여유 확보)

      # === Non-Heap Memory Limits ===
      "-XX:MaxMetaspaceSize=128m",             # Metaspace 최대 크기: 128MB (클래스 메타데이터 저장, 무제한 방지)
      "-XX:ReservedCodeCacheSize=32m",         # JIT 컴파일된 코드 캐시: 32MB (기본 240MB에서 대폭 축소)
      "-XX:MaxDirectMemorySize=64m",           # Direct Buffer 메모리: 64MB (NIO 사용 시 필요, 무제한 방지)
      "-Xss512k",                              # Thread Stack 크기: 512KB (기본 1MB에서 축소, 스레드당 메모리 절약)

      # === Garbage Collection Settings ===
      "-XX:+UseSerialGC",                      # Serial GC 사용 (단일 스레드 GC, 메모리 오버헤드 최소화, 작은 힙에 효율적)
      "-XX:+UseStringDeduplication",           # 중복 문자열 제거 (메모리 절약)

      # === JIT Compiler Settings ===
      "-XX:+TieredCompilation",                # 계층적 컴파일 활성화 (빠른 시작 + 최적화)
      "-XX:TieredStopAtLevel=1",               # C1 컴파일러만 사용 (C2 비활성화로 메모리 절약, 시작 시간 단축)

      # === Performance & Security ===
      "-Djava.security.egd=file:/dev/./urandom", # 빠른 난수 생성 (시작 시간 단축)

      "-jar",
      "app.jar"
    ]

    # Docker Resource Limits (cgroup을 통한 강제 메모리 제한)
    deploy:
      resources:
        limits:
          memory: 600M                         # 컨테이너 최대 메모리: 600MB (OOM 방지)
        reservations:
          memory: 400M                         # 예약 메모리: 400MB (최소 보장 메모리)

    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    driver: bridge